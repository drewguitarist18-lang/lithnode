# Lithnode as a Flatpak, for any Linux (Arch, Fedora, Ubuntu, ...). Built by packaging/linux/build.sh.
# Sandboxed: Lithnode runs claude inside the sandbox, from your home folder (where Anthropic's installer puts it).
# Every permission, and why (the same list is in the store description and the README):
#   --share=network             Claude Code (and Codex or Cursor) talk to their own servers
#   --filesystem=home           the project folders you pick, the CLIs installed in your home folder, their sign-in
#                               (~/.claude), and Lithnode's own data (~/.lithnode)
#   --socket=x11, --share=ipc   draws the window
#   --device=dri                lets the window use your graphics card
# No permission to start programs outside the sandbox, so no "arbitrary permissions" warning.
app-id: com.lithnode.Lithnode
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: lithnode
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --filesystem=home
modules:
  - name: lithnode
    buildsystem: simple
    build-commands:
      - cp -a app /app/lithnode
      - install -Dm755 lithnode.sh /app/bin/lithnode
      - install -Dm644 com.lithnode.Lithnode.desktop /app/share/applications/com.lithnode.Lithnode.desktop
      - install -Dm644 lithnode.png /app/share/icons/hicolor/512x512/apps/com.lithnode.Lithnode.png
      - install -Dm644 com.lithnode.Lithnode.metainfo.xml /app/share/metainfo/com.lithnode.Lithnode.metainfo.xml
    sources:
      - type: dir
        path: stage
