# Lithnode as a Flatpak, for any Linux (Arch, Fedora, Ubuntu, ...). Built by packaging/linux/build.sh.
# Every permission, and why (the same list is in the store description and the README):
#   --talk-name=org.freedesktop.Flatpak  starts claude, codex, cursor-agent, git and the CLIs you allow on your system
#                                        (flatpak-spawn --host), in the folder you pick. Lithnode's whole job; it's also
#                                        why app stores show "Arbitrary permissions".
#   --filesystem=home                    reads the project folders you pick and keeps its data in ~/.lithnode
#   --socket=x11, --share=ipc            draws the window
#   --device=dri                         lets the window use your graphics card
# No network permission: Lithnode itself never goes online (the CLIs it starts use your system's network).
app-id: com.lithnode.Lithnode
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: lithnode
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: lithnode
    buildsystem: simple
    build-commands:
      - cp -a app /app/lithnode
      - install -Dm755 lithnode.sh /app/bin/lithnode
      - install -Dm644 com.lithnode.Lithnode.desktop /app/share/applications/com.lithnode.Lithnode.desktop
      - install -Dm644 lithnode.png /app/share/icons/hicolor/512x512/apps/com.lithnode.Lithnode.png
      - install -Dm644 com.lithnode.Lithnode.metainfo.xml /app/share/metainfo/com.lithnode.Lithnode.metainfo.xml
    sources:
      - type: dir
        path: stage
