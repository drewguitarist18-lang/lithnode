<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* theme from the top-bar switch: dark (default), light or system */try { const t = localStorage.getItem("hq-theme") || "dark"; if (t !== "system") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the app window's title bar takes this color (Edge/Chrome app mode); kept in step with the theme switch -->
<meta name="theme-color" id="barColor" content="#111111">
<link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png?v=2" type="image/png" sizes="32x32">
<title>Lithnode</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8; --bar: #ffffff; --line: #e3e4ea; --ink: #15161c; --muted: #6b6f80;
    --accent: #D97757; --hover: #f0f0f4; --warn: #e5566e; --ok: #4fae6a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0a0a0a; --bar: #111111; --line: #232323; --ink: #ededed; --muted: #8d8d8d;
            --hover: #1c1c1c; --warn: #f7768e; --ok: #9ece6a; }
  }
  /* the theme switch in the top bar forces one or the other */
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0a0a0a; --bar: #111111; --line: #232323; --ink: #ededed; --muted: #8d8d8d;
            --hover: #1c1c1c; --warn: #f7768e; --ok: #9ece6a; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
         display: grid; grid-template-rows: 44px auto 1fr; overflow: hidden; }
  /* "a newer Lithnode is out": a thin strip under the top bar, until it's dismissed for that version */
  .update { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--accent) 12%, var(--bar)); font-size: 12.5px; }
  .update[hidden] { display: none; }
  .update i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .update span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .update span b { font-weight: 650; }
  .update span em { font-style: normal; color: var(--muted); }
  .update a, .update button { flex: none; height: 26px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
                              color: var(--ink); font: 600 12px inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .update a:hover, .update button:hover { background: var(--hover); }
  .update .go { margin-left: auto; background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .update .go:hover { background: var(--ink); filter: brightness(1.1); }
  .update .x { width: 26px; padding: 0; justify-content: center; border-color: transparent; color: var(--muted); font-size: 15px; }
  header { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; background: var(--bar);
           border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 7px; margin-right: 10px; font-size: 12.5px; color: var(--ink); cursor: default; }
  .brand canvas { width: 28px; height: 21px; }
  /* Flows | Office: a small segmented switch, the open one raised */
  nav { display: flex; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel, var(--bg)); }
  nav a { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px; border-radius: 7px; color: var(--muted);
          text-decoration: none; font-weight: 550; transition: background .12s, color .12s; }
  nav a:hover { color: var(--ink); }
  nav a.on { color: var(--ink); background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
  .badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; font-size: 10.5px; font-weight: 700;
           display: none; align-items: center; justify-content: center; background: var(--accent); color: #fff; font-variant-numeric: tabular-nums; }
  .badge.show { display: inline-flex; }
  .badge.warn { background: var(--warn); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px;
            border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 12px; white-space: nowrap;
            min-width: 0; cursor: pointer; transition: background .12s, color .12s; }
  .status:hover, .status[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .status span { overflow: hidden; text-overflow: ellipsis; }
  .status i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.ok i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .status.bad i { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); }
  .status code { background: var(--hover); padding: 1px 6px; border-radius: 5px; font-size: 11.5px; }
  .signin { font: 600 12px inherit; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  .signin:disabled { opacity: .6; cursor: default; }
  /* the account card under the status pill: what the sign-in is, and how to fix it */
  .acct { position: fixed; z-index: 50; top: 48px; right: 10px; width: min(340px, calc(100vw - 20px)); padding: 16px; border-radius: 14px;
          background: var(--pad, var(--panel)); border: 1px solid var(--line); box-shadow: 0 18px 50px -12px var(--shadow, rgba(0,0,0,.45)); }
  .acct[hidden] { display: none; }
  .acct h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14px; font-weight: 650; color: var(--ink); }
  .acct h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .acct.ok h3 i { background: var(--ok); }
  .acct p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .acct p b { color: var(--ink); font-weight: 600; }
  .acct ol { margin: 0 0 12px; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--ink); }
  .acct code { font: 11.5px var(--mono); background: var(--hover); padding: 1px 6px; border-radius: 5px; color: var(--ink); }
  .acct .row { display: flex; gap: 8px; align-items: center; }
  .acct .row button, .acct .row a { height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: transparent;
                                     color: var(--ink); font: 600 12.5px inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .acct .row button:hover, .acct .row a:hover { background: var(--hover); }
  .acct .row .go { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .acct .row .go:hover { background: var(--ink); filter: brightness(1.1); }
  .acct .row .go:disabled { opacity: .6; cursor: default; }
  .acct small { display: block; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .acct p a { color: var(--ink); font-weight: 600; }
  .acct .code { display: flex; gap: 8px; margin: 0 0 10px; }
  .acct .code input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: transparent;
                      color: var(--ink); font: 12px var(--mono); outline: none; }
  .acct .engine { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
  .acct .engine:first-of-type { border-top: 0; }
  .acct .engine .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .acct .engine.on .dot { background: var(--ok); }
  .acct .engine .logo { position: relative; width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center; overflow: hidden; background: #161616; }
  .acct .engine .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .acct .engine .logo.codex img { width: 70%; height: 70%; object-fit: contain; }
  .acct .engine .logo.antigravity img { width: 78%; height: 78%; object-fit: contain; }
  .acct .engine .logo .dot { position: absolute; right: 2px; bottom: 2px; width: 8px; height: 8px; box-shadow: 0 0 0 2px var(--pad, var(--panel)); }
  .acct .engine:not(.on) .logo img { opacity: .55; filter: grayscale(.6); }
  .acct .engine .free { margin-left: 5px; padding: 0 5px; border-radius: 5px; font: 600 10px/16px inherit; color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); vertical-align: 1px; }
  .acct .engine main { flex: 1; min-width: 0; }
  .acct .engine button.ghost { border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 99px; padding: 3px 10px;
    background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); font-weight: 600; }
  .acct .engine button.ghost:hover { background: var(--warn); border-color: var(--warn); color: #fff; }
  .acct .engine .sub { display: block; margin-top: 3px; font-size: 11px; line-height: 1.35; color: var(--muted); }
  .acct .engine a.sub { color: var(--ink); text-decoration: none; }
  .acct .engine a.sub:hover { text-decoration: underline; }
  .acct .engine .sub.bad { color: var(--warn); }
  .acct .engine .bar { display: block; height: 3px; margin-top: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--ok) var(--p), var(--line) var(--p)); }
  .acct .engine .spin { flex: none; width: 16px; height: 16px; margin-right: 6px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: acctspin .8s linear infinite; }
  @keyframes acctspin { to { transform: rotate(360deg); } }
  .acct .engine b { display: block; font-size: 12.5px; color: var(--ink); }
  .acct .engine small { margin: 0; font-size: 11.5px; }
  .acct .engine button { flex: none; height: 28px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 11.5px inherit; cursor: pointer; }
  .acct .engine button:hover { background: var(--hover); }
  .acct .code input:focus { border-color: var(--accent); }
  .acct .code button { height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
                       font: 600 12.5px inherit; cursor: pointer; }
  .acct .err { color: var(--warn); }
  .acct small a { color: var(--muted); }
  .acct small a:hover { color: var(--ink); }
  .acct.wait h3 i { background: var(--accent); animation: acctPulse 1.2s ease-in-out infinite; }
  @keyframes acctPulse { 50% { opacity: .3; } }
  /* round icon buttons: theme and quit */
  .icon { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid transparent;
          background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
  .icon:hover { color: var(--ink); background: var(--hover); }
  .icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .quit:hover { color: var(--warn); }
  .icon.on { color: var(--ink); background: var(--hover); }
  /* File / Edit / View / Help, like any desktop app */
  .menubar { display: flex; gap: 1px; margin-right: 6px; }
  .menubar button { height: 28px; padding: 0 9px; border-radius: 7px; border: 0; background: transparent; color: var(--muted);
                    font: inherit; font-size: 12.5px; cursor: pointer; }
  .menubar button:hover, .menubar button.on { color: var(--ink); background: var(--hover); }
  .frames { position: relative; min-height: 0; grid-row: 3; }   /* row 3 even while the update strip is hidden */
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  iframe.on { display: block; }
  @media (max-width: 640px) { .brand .word, .status span { display: none; } nav a { padding: 0 10px; } }
  /* In Lithnode's own window this bar is the title bar: drag it to move the window; the window's own
     minimize / maximize / close sit at the right (so the Quit button isn't needed) */
  html.native header { -webkit-app-region: drag; user-select: none;
                       padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, calc(100vw - 150px)) + 8px); }
  html.native header :is(a, button, canvas) { -webkit-app-region: no-drag; }
  html.native .quit { display: none; }
  html.native.mac header { padding-left: 84px; padding-right: 16px; }   /* the Mac's own window buttons sit top left */
  /* Settings: one window, a few plain sections, each row a label on the left and its control on the right */
  dialog.set { width: min(640px, calc(100vw - 32px)); max-height: min(760px, calc(100vh - 48px)); padding: 0; border-radius: 16px;
               border: 1px solid var(--line); background: var(--bar); color: var(--ink); box-shadow: 0 24px 70px rgba(0,0,0,.45);
               display: none; flex-direction: column; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  dialog.set[open] { display: flex; animation: setIn .14s ease-out; }
  dialog.set::backdrop { background: rgba(8, 9, 14, .5); backdrop-filter: blur(2px); }
  @keyframes setIn { from { opacity: 0; transform: scale(.97); } }
  .set .top { display: flex; align-items: center; padding: 16px 16px 12px 22px; border-bottom: 1px solid var(--line); }
  .set .top h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .set .top button { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted);
                     font-size: 17px; cursor: pointer; }
  .set .top button:hover { background: var(--hover); color: var(--ink); }
  .set .body { overflow-y: auto; padding: 0 22px 18px; }
  .set h3 { display: flex; align-items: center; gap: 9px; margin: 20px 0 4px; font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
            color: color-mix(in srgb, var(--ic, var(--muted)) 70%, var(--ink)); }
  .set h3 i.ci { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--ic);
                 background: color-mix(in srgb, var(--ic) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ic) 24%, transparent); }
  .set h3 i.ci svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .set .row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .set .row:last-child { border-bottom: 0; }
  .set .row > div:first-of-type { flex: 1; min-width: 0; }
  .set .row.eng { gap: 12px; }
  .set .mcmd { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; padding: 6px 6px 6px 12px; border-radius: 10px;
               background: color-mix(in srgb, #D97757 7%, var(--hover)); box-shadow: inset 0 0 0 1px color-mix(in srgb, #D97757 22%, transparent); }
  .set .mcmd code { flex: 1; min-width: 0; font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--ink); white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .set .mcmd .btn { height: 26px; font-size: 12px; }
  .set .kintro i { color: var(--ink); font-style: normal; }
  .set .kintro { margin: -2px 0 6px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .set .row.key .ktile { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px;
                         color: var(--ec); background: color-mix(in srgb, var(--ec) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ec) 40%, transparent); }
  .set .row.key small a { color: var(--ec); text-decoration: none; font-weight: 550; }
  .set .row.key small a:hover { text-decoration: underline; }
  .set .row.key .kin { width: 150px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 12px; }
  .set .row.key .kin:focus { outline: none; border-color: var(--ec); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ec) 20%, transparent); }
  .set .row.eng .btn, .set .row.eng a.btn { height: 28px; padding: 0 11px; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center;
                                            color: var(--ec); border-color: color-mix(in srgb, var(--ec) 45%, var(--line)); background: color-mix(in srgb, var(--ec) 10%, transparent); }
  .set .row.eng .btn.ghost { color: var(--muted); border-color: var(--line); background: transparent; }
  .set .row.eng .btn:hover { background: color-mix(in srgb, var(--ec) 20%, transparent); }
  .set .row.eng .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ec) 30%, transparent); border-top-color: var(--ec);
                        animation: acctspin .8s linear infinite; flex: none; }
  .set .row .bad { color: var(--warn); }
  .set .st.wait { color: #ffb547; background: color-mix(in srgb, #ffb547 13%, transparent); }
  .set .st.wait i { background: #ffb547; }
  .set .epick { flex: none; display: flex; gap: 6px; }
  .set .epick button { width: 34px; height: 34px; padding: 0; border-radius: 10px; border: 0; background: #161616; cursor: pointer; overflow: hidden; display: grid; place-items: center;
                       box-shadow: 0 0 0 1px var(--line); opacity: .55; transition: opacity .12s, box-shadow .12s, transform .12s; }
  .set .epick button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .set .epick button[data-engine-pick="codex"] img { width: 70%; height: 70%; object-fit: contain; }
  .set .epick button[data-engine-pick="antigravity"] img { width: 78%; height: 78%; object-fit: contain; }
  .set .epick button:hover { opacity: .85; }
  .set .epick button.on { opacity: 1; box-shadow: 0 0 0 2px var(--ec), 0 0 14px -3px var(--ec); transform: translateY(-1px); }
  .set .use { display: grid; gap: 8px; padding: 8px 0 4px; }
  .set .urow { display: grid; grid-template-columns: minmax(0, 150px) 1fr auto; align-items: center; gap: 12px; }
  .set .urow .un { min-width: 0; }
  .set .urow .un b { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .set .urow .un small { margin: 0; font-size: 11px; }
  .set .ubar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--uc) 12%, var(--hover)); overflow: hidden; }
  .set .ubar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--uc) 60%, #fff 0%), var(--uc));
                 box-shadow: 0 0 10px -2px var(--uc); }
  .set .uv { font-size: 12px; font-weight: 600; color: var(--uc); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .set .uv small { display: inline; color: var(--muted); font-weight: 500; }
  .set .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; padding: 8px 0 4px; }
  .set .krow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 4px 0; }
  .set .krow > span:last-child { display: inline-flex; align-items: center; gap: 3px; }
  .set .krow i { font-style: normal; color: var(--muted); font-size: 11px; }
  .set kbd { font: 600 11px/1 inherit; min-width: 22px; padding: 4px 6px; border-radius: 6px; text-align: center; color: var(--kc);
             background: color-mix(in srgb, var(--kc) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--kc) 32%, transparent), 0 1px 0 color-mix(in srgb, var(--kc) 35%, transparent); }
  .set .about { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-top: 8px; border-radius: 12px;
                background: linear-gradient(120deg, color-mix(in srgb, #D97757 12%, transparent), color-mix(in srgb, #8b7cff 10%, transparent) 60%, color-mix(in srgb, #47d7e0 10%, transparent));
                box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 80%, transparent); }
  .set .about canvas { width: 64px; height: 48px; flex: none; image-rendering: pixelated; }
  .set .about b { display: block; font-size: 14px; font-weight: 650; }
  .set .about b span { font-size: 11px; font-weight: 600; color: #36d39a; background: color-mix(in srgb, #36d39a 14%, transparent); padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .set .about small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .set .about .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .set .about .links a { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 550;
                         color: var(--ink); text-decoration: none; background: color-mix(in srgb, var(--ic) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ic) 30%, transparent); }
  .set .about .links a:hover { background: color-mix(in srgb, var(--ic) 22%, transparent); }
  .set .about .links svg { width: 13px; height: 13px; fill: none; stroke: var(--ic); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 520px) { .set .keys { grid-template-columns: 1fr; } .set .urow { grid-template-columns: 1fr auto; } .set .ubar { grid-column: 1 / -1; grid-row: 2; } }
  .set .elogo { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: #161616;
                box-shadow: 0 0 0 1px color-mix(in srgb, var(--ec) 55%, transparent), 0 0 14px -4px var(--ec); }
  .set .elogo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .set .elogo.codex img { width: 70%; height: 70%; object-fit: contain; }
  .set .elogo.antigravity img { width: 78%; height: 78%; object-fit: contain; }
  .set .elogo.off { box-shadow: 0 0 0 1px var(--line); }
  .set .elogo.off img { opacity: .5; filter: grayscale(.7); }
  .set .row.eng b { color: color-mix(in srgb, var(--ec) 35%, var(--ink)); }
  .set .free { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; padding: 1px 5px; border-radius: 5px; vertical-align: 1px;
               color: #36d39a; background: color-mix(in srgb, #36d39a 16%, transparent); }
  .set .seg button { display: inline-flex; align-items: center; gap: 6px; }
  .set .seg button svg { width: 13px; height: 13px; fill: none; stroke: var(--ic); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .set .seg button.on { color: var(--ic) !important; background: color-mix(in srgb, var(--ic) 16%, transparent) !important;
                        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ic) 35%, transparent) !important; }
  .set .btn { display: inline-flex; align-items: center; gap: 7px; }
  .set .btn svg { width: 14px; height: 14px; fill: none; stroke: var(--ic, currentColor); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .set .btn[style*="--ic"]:hover { background: color-mix(in srgb, var(--ic) 14%, transparent); border-color: color-mix(in srgb, var(--ic) 40%, var(--line)); }
  .set .st { padding: 3px 9px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 10%, transparent); min-width: 0; }

  .set .row b { display: block; font-weight: 600; }

  .set .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid var(--line); flex: none; }
  .set .seg button { height: 26px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 550 12.5px inherit; cursor: pointer; }
  .set .seg button:hover { color: var(--ink); }
  .set .seg button.on { color: var(--ink); background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
  .set select, .set .btn { flex: none; height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: transparent;
                           color: var(--ink); font: 600 12.5px inherit; cursor: pointer; }
  .set select { padding-right: 8px; }

             background: color-mix(in srgb, var(--muted) 45%, transparent); transition: background .15s; }
  .set .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
                    transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .set .sw[aria-checked="true"] { background: var(--ok); }
  .set .sw[aria-checked="true"]::after { transform: translateX(16px); }
  .set .st { flex: none; display: inline-flex; align-items: center; gap: 6px; min-width: 96px; font-size: 12px; color: var(--muted); }
  .set .st i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .set .st.ok i { background: var(--ok); }
  .set .st.bad i { background: var(--warn); }
</style>

  <div class="body" id="setBody"></div>
</dialog>
<script src="/static/sprites.js"></script>
<script src="/static/ui.js"></script>
<script>
"use strict";
const TABS = ["flows", "office"];
const frames = {};
const $ = (id) => document.getElementById(id);

function show(tab) {
  if (!TABS.includes(tab)) tab = "flows";
  if (!frames[tab]) {               // load each tab the first time it's opened, then keep it alive
    const f = document.createElement("iframe");
    f.src = "/" + tab; f.title = tab;
    f.addEventListener("load", () => applyTheme(f));
    $("frames").appendChild(f); frames[tab] = f;
  }
  for (const [k, f] of Object.entries(frames)) f.classList.toggle("on", k === tab);
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  try { localStorage.setItem("hq-tab", tab); } catch (e) {}
}
// ---- theme: dark (default) → light → system, saved and applied to every tab at once
const THEMES = {   // icon, name
  dark: ['<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', "Dark"],
  light: ['<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>', "Light"],
  system: ['<rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/>', "Same as your computer"],
};
let themeMode = "dark";
try { themeMode = localStorage.getItem("hq-theme") || "dark"; } catch (e) {}
if (!THEMES[themeMode]) themeMode = "dark";
function applyTheme(frame) {
  const doc = frame ? frame.contentDocument : document;
  if (!doc) return;
  if (themeMode === "system") delete doc.documentElement.dataset.theme;
  else doc.documentElement.dataset.theme = themeMode;
  if (frame && typeof frame.contentWindow.readTheme === "function") frame.contentWindow.readTheme();  // canvas colors
}
function applyAll() {
  applyTheme();
  for (const f of Object.values(frames)) applyTheme(f);
  const [icon, name] = THEMES[themeMode], next = THEMES[Object.keys(THEMES)[(Object.keys(THEMES).indexOf(themeMode) + 1) % 3]][1];
  $("themeBtn").innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`;
  $("themeBtn").title = `Theme: ${name}. Click for ${next.toLowerCase()}`;
  // the window's title bar matches the top bar, so it isn't a white strip over a dark app
  const css = getComputedStyle(document.documentElement), bar = css.getPropertyValue("--bar").trim() || "#111111";
  $("barColor").content = bar;
  if (window.lithnodeApp) window.lithnodeApp.setBar(bar, css.getPropertyValue("--muted").trim() || "#8d8d8d");   // own window: recolor its title bar
}
const PREVIEW_MAC = new URLSearchParams(location.search).has("mac");   // ?mac previews the Mac app from another computer
if (window.lithnodeApp || PREVIEW_MAC) document.documentElement.classList.add("native", ...(window.lithnodeApp?.platform === "darwin" || PREVIEW_MAC ? ["mac"] : []));
// Mac key labels: ⌘ for Ctrl (every shortcut also takes ⌘), ⌫ for Delete, ↩ for Enter
const MAC = PREVIEW_MAC || (window.lithnodeApp ? window.lithnodeApp.platform === "darwin" : /mac/i.test(navigator.userAgentData?.platform || navigator.platform));
window.lithnodeMac = MAC;   // flows.html reads it for its own labels
const KEY = (k) => (MAC ? { Ctrl: "⌘", Enter: "↩", Del: "⌫" }[k] ?? k : k);
const K = (s) => s.split("+").map(KEY).join(MAC ? "" : "+");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (themeMode === "system") applyAll(); });
$("themeBtn").onclick = () => {
  const order = Object.keys(THEMES);
  themeMode = order[(order.indexOf(themeMode) + 1) % order.length];
  try { localStorage.setItem("hq-theme", themeMode); } catch (e) {}
  applyAll();
};
applyAll();

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
let first = location.hash.slice(1);
if (!first) { try { first = localStorage.getItem("hq-tab") || "flows"; } catch (e) { first = "flows"; } }
show(first);

function badge(id, n, warn) {
  const b = $(id); b.textContent = n; b.classList.toggle("show", n > 0); b.classList.toggle("warn", !!warn);
}
let account = {}, engineStatus = {}, signin = {}, greeted = false, trouble = false, polls = 0;
async function poll() {
  try {
    // signed out: ask Claude Code again now and then, so signing in elsewhere shows up by itself
    const fresh = !account.logged_in && !signin.active && ++polls % 5 === 0;
    const d = await (await fetch("/api/hq" + (fresh ? "?fresh=1" : ""), { cache: "no-store" })).json();
    badge("b-flows", d.approvals || d.runs, d.approvals > 0);
    badge("b-office", d.agents);
    const cc = d.claude_code || {}, es = d.engines || {}, si = d.signin || {}, st = $("status");
    const changed = JSON.stringify([cc, es, si]) !== JSON.stringify([account, engineStatus, signin]);
    account = cc; engineStatus = es; signin = si;
    const signed = Object.entries(es).filter(([, v]) => v.installed && v.signed_in).map(([id]) => LABEL[id] || id);
    st.className = "status " + (signed.length ? "ok" : "bad");
    st.querySelector("span").textContent = signed.length === 1 ? `${signed[0]} ${signed[0] === "Ollama" ? "ready" : "signed in"}`
      : signed.length ? `${signed.length} engines ready` : "No engine signed in";
    $("signinBtn").hidden = true;
    // first look at a signed-out Lithnode: open the card so signing in is one click away, once the first-launch notice
    // (flows.html's usage dialog) is out of the way, so there's one thing on screen at a time
    let noticed = true; try { noticed = localStorage.getItem("hq-usage-ok-2") === "1"; } catch (e) {}
    if (!greeted && noticed) { greeted = true; if (!signed.length) toggleAcct(true); }
    if (changed && !$("acct").hidden) renderAcct();
    if (changed && $("settings").open) renderEngines();
    watchRuns(d);
    document.title = (d.approvals ? "(!) " : "") + "Lithnode" + (d.agents ? ` · ${d.agents} working` : "");
  } catch (e) {
    $("status").className = "status bad"; $("status").querySelector("span").textContent = "Server offline";
  }
}
poll(); setInterval(poll, 2000);

// Lithnode has no account of its own. Each engine uses the account already signed in to its own CLI.
const LABEL = { claude: "Claude Code", codex: "Codex", cursor: "Cursor", antigravity: "Antigravity", ollama: "Ollama", api: "API keys" };
const ENGINE_COLOR = { claude: "#D97757", codex: "#10a37f", cursor: "#4fa8ff", antigravity: "#8b7cff", ollama: "#36d39a", api: "#ff6b8b" };   // the tint around each logo in Settings
const ENGINE_LOGO = { claude: "engine-claude.svg", codex: "engine-codex.png", cursor: "engine-cursor.png", antigravity: "engine-antigravity.png", ollama: "engine-ollama.png", api: "engine-api.svg" };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// The one button an engine needs right now: install it, sign in, start it, or sign out. The account card and Settings share it.
function engineBtn(id, cls) {
  const e = engineStatus[id] || {}, on = e.installed && e.signed_in, job = e.job || {};
  const c = cls ? ` class="${cls}"` : "", ghost = cls ? ` class="${cls} ghost"` : ` class="ghost"`;
  if (job.busy || (id === "claude" && signin.active && !on) || pending[id]) return `<span class="spin" aria-label="Working"></span>`;
  if (id === "api") return on ? "" : `<button type="button"${c} data-act="keys">Add a key</button>`;
  if (on) return id === "ollama" ? "" : `<button type="button"${ghost} data-act="signout" data-engine="${id}">Sign out</button>`;
  if (id === "claude") return e.installed ? `<button type="button"${c} data-act="login">Sign in</button>` : `<a${c} href="https://claude.com/claude-code" target="_blank" rel="noopener">Install</a>`;
  if (id === "ollama") return `<button type="button"${c} data-act="engine-install" data-engine="ollama">${!e.installed ? "Install" : /not running/i.test(e.note || "") ? "Start" : "Get a model"}</button>`;
  return e.installed ? `<button type="button"${c} data-act="engine-login" data-engine="${id}">Sign in</button>` : `<button type="button"${c} data-act="engine-install" data-engine="${id}">Install</button>`;
}
function renderAcct() {
  const cc = account, si = signin, a = $("acct");
  const typed = $("codeIn")?.value || "", focused = document.activeElement?.id === "codeIn";   // a poll mustn't eat a half-pasted code
  a.className = "acct" + (Object.values(engineStatus).some((e) => e.installed && e.signed_in) ? " ok" : si.active ? " wait" : "");
  const err = si.error ? `<p class="err">${esc(si.error)}</p>` : "";
  const rows = ["claude", "codex", "cursor", "antigravity", "ollama"].map((id) => {
    const e = engineStatus[id] || {}, on = e.installed && e.signed_in, job = e.job || {};
    const claudeWaiting = id === "claude" && si.active && !on;
    const busy = job.busy || claudeWaiting || pending[id];
    const action = engineBtn(id, "");
    const state = pending[id] === "signout" ? "Signing out…"
      : job.busy && job.kind === "login" ? "Finish signing in in your browser"
      : job.busy ? (id === "ollama" && e.installed ? "Downloading a model" : "Installing") + (job.pct != null ? ` · ${job.pct}%` : "…")
      : claudeWaiting ? "Finish signing in in your browser"
      : pending[id] ? "Starting…"
      : on ? (id === "ollama" ? "Ready · runs on this PC" : "Signed in")
      : !e.installed ? (/Cursor app/.test(e.note || "") ? "Cursor app found · its CLI isn't" : "Not installed")
      : id === "ollama" ? (/not running/i.test(e.note || "") ? "Installed · not running" : "No model downloaded yet") : "Needs sign-in";
    const extra = job.busy && job.url ? `<a class="sub" href="${esc(job.url)}" target="_blank" rel="noopener">Browser didn't open? Open the sign-in page</a>`
      : job.error || errs[id] ? `<span class="sub bad">${esc(errs[id] || job.error)}</span>`
      : hints[id] && !on ? `<span class="sub">${esc(hints[id])}</span>` : "";
    const bar = job.busy && job.pct != null ? `<i class="bar" style="--p:${job.pct}%"></i>` : "";
    const tip = esc(e.note || "");
    return `<div class="engine ${on ? "on" : ""}${busy ? " busy" : ""}" title="${tip}"><span class="logo ${id}"><img src="/static/${ENGINE_LOGO[id]}" alt=""><i class="dot"></i></span><main><b>${LABEL[id]}${id === "ollama" ? `<span class="free">FREE</span>` : ""}</b><small>${esc(state)}</small>${bar}${extra}</main>${action}</div>`;
  }).join("");
  const claudeHelp = !cc.logged_in && cc.available && si.active ? `
    <p>Finish Claude Code sign-in in your browser.</p>
    ${trouble || si.error ? `<p>${si.url ? `<a href="${esc(si.url)}" target="_blank" rel="noopener">Open the sign-in page</a>, then paste` : "Paste"} the code it shows:</p><form class="code"><input id="codeIn" placeholder="Paste the code" autocomplete="off" spellcheck="false" aria-label="Sign-in code"><button>Sign in</button></form>${err}` : `<small><a href="#" data-act="trouble">Having trouble?</a></small>`}` : "";
  a.innerHTML = `<h3><i></i>Agent engines</h3><p>Flows use any engine ready on this computer. Build flow chooses the first available one. Ollama runs free models on your own PC.</p>${rows}${claudeHelp}<div class="row"><button data-act="check">Check again</button></div>`;
  const input = $("codeIn");
  if (input) { input.value = typed; if (focused) input.focus(); }
  if ($("settings").open) renderEngines();
}
async function startSignin() {
  signin = { active: true, url: "", error: "" }; trouble = false;
  $("signinBtn").textContent = "Finish signing in…";
  toggleAcct(true);
  try { await fetch("/api/signin", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); } catch (e) {}
  poll();
}
async function sendCode(code) {
  signin = { ...signin, error: "" };
  try {
    const r = await fetch("/api/signin/code", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    if (!r.ok) signin = { ...signin, error: (await r.json()).error || "That didn't work." };
  } catch (e) {}
  renderAcct(); setTimeout(poll, 600);
}
async function checkNow() {
  try { await fetch("/api/hq?fresh=1", { cache: "no-store" }); } catch (e) {}
  await poll();
  if (!$("acct").hidden) renderAcct();
}
// install, sign in and sign out all happen in the background: the card shows how it's going, no terminal
const pending = {}, errs = {}, hints = {};
async function engineAction(engine, path, kind) {
  pending[engine] = kind; delete errs[engine]; renderAcct();
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ engine }) });
    const d = await r.json();
    if (!r.ok) errs[engine] = d.message || "That didn't work.";
    else if (engine === "antigravity" && kind === "login") hints[engine] = d.message;   // agy signs in from its own window
    if (/starting/i.test(d.message || "")) setTimeout(checkNow, 4000);
  } catch (e) { errs[engine] = "Lithnode's server didn't answer."; }
  if (kind === "signout") { try { await fetch("/api/hq?fresh=1", { cache: "no-store" }); } catch (e) {} }
  delete pending[engine];
  await poll(); renderAcct();
}
const startEngineSignin = (engine) => engineAction(engine, "/api/engine-login", "login");
const startEngineInstall = (engine) => engineAction(engine, "/api/engine-install", "install");
function signOutEngine(engine) {
  const also = engine === "antigravity" ? " This also signs you out of the Antigravity app." : "";
  if (!confirm(`Sign out of ${LABEL[engine]}? Teams set to ${LABEL[engine]} won't run until you sign in again.${also}`)) return;
  engineAction(engine, "/api/engine-signout", "signout");
}
function toggleAcct(open = $("acct").hidden) {
  $("acct").hidden = !open; $("status").setAttribute("aria-expanded", String(open));
  if (open) renderAcct();
}
$("status").onclick = () => toggleAcct();
$("signinBtn").onclick = () => signin.active ? toggleAcct(true) : startSignin();
$("acct").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = $("codeIn").value.trim();
  if (code) sendCode(code);
});
$("acct").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act) e.preventDefault();
  if (act === "login") startSignin();
  if (act === "engine-install") startEngineInstall(e.target.closest("[data-engine]").dataset.engine);
  if (act === "engine-login") startEngineSignin(e.target.closest("[data-engine]").dataset.engine);
  if (act === "signout") signOutEngine(e.target.closest("[data-engine]").dataset.engine);
  if (act === "trouble") { trouble = true; renderAcct(); $("codeIn")?.focus(); }
  if (act === "check") { e.target.textContent = "Checking…"; checkNow(); }
});
document.addEventListener("mousedown", (e) => { if (!$("acct").hidden && !e.target.closest("#acct, #status")) toggleAcct(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("acct").hidden) toggleAcct(false); });
const onTab = () => (frames.office && frames.office.classList.contains("on") ? "office" : "flows");
const goTab = (t) => { history.replaceState(null, "", "#" + t); show(t); };
// ---- the menu bar: most of it acts on the Flows page (flows.html's flowsApi), switching to it first
const flowsDo = (fn) => () => {
  if (onTab() !== "flows") goTab("flows");
  const go = () => { const api = frames.flows.contentWindow.flowsApi; if (api) fn(api); else setTimeout(go, 150); };
  go();
};
const fapi = () => (frames.flows && frames.flows.contentWindow.flowsApi) || null;

const THEME_COLOR = { dark: "#7aa2f7", light: "#ffb547", system: "#47d7e0" };
const mi = (k) => ui.icon(k);
const MENUS = {
  file: () => [
    { icon: mi("plus"), label: "New flow", action: flowsDo((a) => a.newFlow()) },
    { icon: mi("tpl"), label: "New from a template…", action: flowsDo((a) => a.newFromTemplate()) },
    { icon: mi("copy"), label: "Duplicate flow", action: flowsDo((a) => a.duplicate()) },
    { sep: true },
    { icon: mi("imp"), label: "Import team file…", hint: K("Ctrl+O"), action: flowsDo((a) => a.importTeam()) },
    { icon: mi("exp"), label: "Export team file", hint: K("Ctrl+S"), action: flowsDo((a) => a.exportTeam()) },
    { sep: true },

let release = {};
function showUpdate() {

// Update now: the server downloads the installer and runs it with no windows; it closes this app and reopens it
async function updateNow() {
  const u = $("update"), say = (html) => { u.innerHTML = `<i></i><span>${html}</span>`; };
  let res = {};
  try { res = await (await fetch("/api/update", { method: "POST" })).json(); } catch (e) {}
  if (!res.ok) { await ui.confirm({ title: "Couldn't update", text: res.message || "Lithnode couldn't start the update.", ok: "OK", cancel: "" }); return; }
  say(`<b>Updating to ${esc(release.latest)}…</b> <em>Downloading</em>`);
  for (;;) {
    await new Promise((ok) => setTimeout(ok, 500));
    let j = {};
    try { j = await (await fetch("/api/update", { cache: "no-store" })).json(); } catch (e) { j = { state: "installing" }; }   // the app closing for the install
    if (j.state === "downloading") say(`<b>Updating to ${esc(release.latest)}…</b> <em>Downloading ${j.pct}%</em>`);
    else if (j.state === "installing") { say(`<b>Installing ${esc(release.latest)}…</b> <em>Lithnode will close and reopen by itself.</em>`); return; }
    else if (j.state === "failed") { showUpdate(); await ui.confirm({ title: "Couldn't update", text: j.error, ok: "OK", cancel: "" }); return; }
  }
}

        `<option value="${esc(m.id)}"${m.id === p.model ? " selected" : ""}>${esc(m.label)}</option>`).join("")}${p.model && !pickModels.some((m) => m.id === p.model) ? `<option value="${esc(p.model)}" selected>${esc(p.model)}</option>` : ""}</select></div>
    <div class="row"><div><b>Roles</b><small>Each team gets a role (think, build, run…) and the model set for that role.</small></div>${sw("roles", p.roles, "Roles for new flows")}</div>
    <div class="row"><div><b>Token limit</b><small>A run stops once it has used this many. Each flow can change its own.</small></div>
      <select data-key="limit" aria-label="Token limit for new flows">${limits.map((n) =>
        `<option value="${n}"${n === p.limit ? " selected" : ""}>${shortTokens(n)} tokens</option>`).join("")}</select></div>
    ${h("tidyLr", "Canvas")}
    <div class="row"><div><b>Auto-arrange new flows</b><small>Keeps nodes neatly laid out as you edit. The button by the zoom turns it off for one flow.</small></div>${sw("auto", p.auto, "Auto-arrange new flows")}</div>
    <div class="row"><div><b>New flows go</b><small>Which way a blank flow runs.</small></div>
      ${seg("Direction", "data-dir", p.dir, [["lr", "Across", "#4fa8ff", SEG_SVG.across], ["tb", "Down", "#c084fc", SEG_SVG.down]])}</div>
    <div class="row"><div><b>Show flows as</b><small>Same as the Nodes / Steps switch on the canvas.</small></div>
      ${seg("View", "data-view", view, [["nodes", "Nodes", "#36d39a", SEG_SVG.nodes], ["steps", "Steps", "#ffb547", SEG_SVG.steps]])}</div>
    ${h("bell", "Notifications")}
    <div class="row"><div><b>Sound</b><small>A short chime when a run finishes or needs your OK.</small></div>${sw("notify_sound", p.notify_sound, "Sound alerts")}</div>
    <div class="row"><div><b>Desktop alert</b><small>A system notification, so you hear about it while you're in another app.</small></div>${sw("notify_desktop", p.notify_desktop, "Desktop alerts")}</div>
    <div class="row"><div><b>Try it</b><small>Plays whatever you've turned on.</small></div><button type="button" class="btn" data-act="test-alert" style="--ic:#ffb547">${btnIco("bell")}Test</button></div>
    ${h("chart", "Token usage")}
    <div id="setUse">${usageRows()}</div>
    ${h("kbd", "Shortcuts")}
    <div class="keys">${SHORTCUTS.map(([what, ks, col]) => `<div class="krow" style="--kc:${col}"><span>${what}</span><span>${ks.map((k) => `<kbd>${KEY(k)}</kbd>`).join(MAC ? "" : "<i>+</i>")}</span></div>`).join("")}</div>
    ${h("update", "Updates")}
    <div class="row"><div><b>Tell me when a new version is out</b><small>Asks GitHub every few hours. Nothing about you is sent.</small></div>${sw("check_updates", p.check_updates, "Check for updates")}</div>
    <div class="row"><div><b>Count my install</b><small>Once per version, tells lithnode.com "installed" or "updated", with the version and Windows, Mac or Linux. Nothing about you.</small></div>${sw("count_install", p.count_install, "Count my install")}</div>
    <div class="row"><div><b>Lithnode ${esc(prefs.version)}</b><small id="setUpd">${release.newer ? `${esc(release.latest)} is out. The download is in the bar at the top.` : "The version you have."}</small></div>
      <button type="button" class="btn" data-act="check" style="--ic:#36d39a">${btnIco("update")}Check now</button></div>
    ${h("folder", "Your files")}
    <div class="row"><div><b>Lithnode folder</b><small>${esc(prefs.folder)}</small><small>Your flows, past runs and logs. Uninstalling Lithnode leaves it.</small></div>
      <button type="button" class="btn" data-act="folder" style="--ic:#47d7e0">${btnIco("folder")}Open</button></div>
    ${h("info", "About")}
    <div class="about"><canvas id="aboutLogo" width="96" height="72"></canvas><div><b>Lithnode <span>${esc(prefs.version)}</span></b><small>Teams of AI agents, wired up like a flowchart.</small>
      <span class="links">
        <a href="https://lithnode.com" target="_blank" rel="noopener" style="--ic:#4fa8ff">${btnIco("web")}Website</a>
        <a href="${REPO}" target="_blank" rel="noopener" style="--ic:#c084fc">${btnIco("code")}GitHub</a>
        <a href="${REPO}/issues" target="_blank" rel="noopener" style="--ic:#ff8a65">${btnIco("bug")}Report a bug</a>
      </span></div></div>`;
  const al = $("aboutLogo").getContext("2d"); al.clearRect(0, 0, 96, 72); drawLogo(al, 12, 9, 4.5);
}
// ---- run alerts: a chime and / or a desktop notification when a run ends or stops to ask you
let alertPrefs = null, lastRuns = null, lastApprovals = null;
const loadAlertPrefs = async () => { try { alertPrefs = (await (await fetch("/api/settings", { cache: "no-store" })).json()).settings; } catch (e) {} };
loadAlertPrefs();
function chime(kind) {
  if (kind === "ok") {   // a run finished: the recorded sound, with the synth notes as a fallback
    const a = chime.done || (chime.done = new Audio("/static/sound-done.mp3"));
    a.currentTime = 0; a.volume = 0.8;
    const played = a.play();
    if (played) { played.catch(() => synth(kind)); return; }
  }
  synth(kind);
}
function synth(kind) {
  try {
    const ac = chime.ac || (chime.ac = new (window.AudioContext || window.webkitAudioContext)());
    const notes = kind === "ask" ? [660, 880] : kind === "bad" ? [440, 330] : [523, 659, 784];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.12;
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.start(t); o.stop(t + 0.4);
    });
  } catch (e) {}
}
async function runAlert(kind, title, body, test) {
  const p = alertPrefs || {};
  if (p.notify_sound || test === "sound") chime(kind);
  if (p.notify_desktop && "Notification" in window) {
    if (Notification.permission === "default") { try { await Notification.requestPermission(); } catch (e) {} }
    if (Notification.permission === "granted") { try { new Notification(title, { body, icon: "/static/logo-512.png", silent: true }); } catch (e) {} }
  }
}
async function watchRuns(d) {
  const runs = d.runs || 0, asks = d.approvals || 0;
  if (lastApprovals !== null && asks > lastApprovals) runAlert("ask", "A run needs you", "A flow is waiting for your OK to keep going.");
  if (lastRuns !== null && runs < lastRuns) {
    let r = null; try { r = ((await (await fetch("/api/runs", { cache: "no-store" })).json()).runs || [])[0]; } catch (e) {}
    const ok = !r || r.status === "done";
    runAlert(ok ? "ok" : "bad", ok ? "Run finished" : `Run ${r.status}`, r ? `${r.flow_name || "Your flow"} ${ok ? "is done. The report is ready." : "didn't finish."}` : "A flow finished.");
  }
  lastRuns = runs; lastApprovals = asks;
}
async function saveSetting(key, value) {
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ [key]: value }) });
    prefs.settings = (await r.json()).settings;
  } catch (e) {}
  renderSettings();
  alertPrefs = prefs.settings; fapi()?.reloadPrefs?.();
  if (key === "check_updates") checkUpdates(false);
  if (key === "notify_desktop" && value && "Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch (e) {} }
}
$("settings").addEventListener("click", async (e) => {
  const d = $("settings");
  if (e.target === d) return d.close();                       // a click on the dim backdrop
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.act === "close") d.close();
  if (t.dataset.theme) { themeMode = t.dataset.theme; try { localStorage.setItem("hq-theme", themeMode); } catch (e) {} applyAll(); renderSettings(); }
  if (t.classList.contains("sw")) saveSetting(t.dataset.key, t.getAttribute("aria-checked") !== "true");
  if (t.dataset.act === "folder") { try { await fetch("/api/settings/open-folder", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); } catch (e) {} }
  if (t.dataset.act === "login") { d.close(); startSignin(); }
  if (t.dataset.act === "engine-install") startEngineInstall(t.dataset.engine);
  if (t.dataset.act === "engine-login") startEngineSignin(t.dataset.engine);
  if (t.dataset.act === "signout") signOutEngine(t.dataset.engine);
  if (t.dataset.act === "keys") $("setKeys")?.scrollIntoView({ behavior: "smooth", block: "start" });
  if (t.dataset.act === "key-save") saveKey(t.dataset.provider);
  if (t.dataset.act === "key-remove") removeKey(t.dataset.provider);
  if (t.dataset.act === "mcp-add") mcpAct("/api/mcp/add");
  if (t.dataset.act === "mcp-remove") mcpAct("/api/mcp/remove");
  if (t.dataset.act === "mcp-copy" && mcp) {
    try { await navigator.clipboard.writeText(mcp[t.dataset.what]); t.textContent = "Copied"; setTimeout(() => { t.textContent = t.dataset.what === "cli" ? "Copy" : "Copy config"; }, 1400); }
    catch (e) { t.textContent = "Couldn't copy"; }
  }
  if (t.dataset.enginePick && t.dataset.enginePick !== prefs?.settings?.engine) { await saveSetting("model", ""); saveSetting("engine", t.dataset.enginePick); }
  if (t.dataset.dir) saveSetting("dir", t.dataset.dir);
  if (t.dataset.view) { fapi()?.setView?.(t.dataset.view); renderSettings(); }
  if (t.dataset.act === "test-alert") {
    const p = alertPrefs || {};
    if (!p.notify_sound && !p.notify_desktop) chime("ok");
    else runAlert("ok", "Run finished", "This is what you'll get when a flow is done.");
  }
  if (t.dataset.act === "check") {
    t.disabled = true; t.textContent = "Checking…";
    try { release = await (await fetch("/api/version?refresh=1", { cache: "no-store" })).json(); } catch (e) { release = {}; }
    if (release.newer) { try { localStorage.removeItem("hq-update-skip"); } catch (e) {} }
    showUpdate();
    t.disabled = false; t.textContent = "Check now";
    $("setUpd").textContent = release.newer ? `${release.latest} is out. The download is in the bar at the top.`
      : release.checked ? "You're on the newest version." : "Couldn't reach GitHub. Check your connection.";
  }
});
$("settings").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("kin")) { e.preventDefault(); saveKey(e.target.dataset.provider); } });
$("settings").addEventListener("change", (e) => {
  if (e.target.dataset.key === "limit") saveSetting("limit", +e.target.value);
  if (e.target.dataset.key === "model") saveSetting("model", e.target.value);
});
window.openSettings = openSettings;   // flows.html's Ctrl+, opens it too
document.addEventListener("keydown", (e) => {
  if (e.key === "," && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSettings(); }
  if (e.key.toLowerCase() === "r" && (e.ctrlKey || e.metaKey) && !e.shiftKey) { e.preventDefault(); checkAndReload(); }
  if (e.key === "s" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (location.hash !== "#office") fapi()?.exportTeam?.(); }   // not the browser's Save page
});

const lg = $("logo").getContext("2d");
(function frame(ms) {
  requestAnimationFrame(frame);
  lg.clearRect(0, 0, 96, 72);
  drawLogo(lg, 12, 9, 4.5);
})(0);
</script>
