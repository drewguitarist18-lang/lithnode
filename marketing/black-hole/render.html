<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
const FS = `
    precision highp float;
    uniform vec2 uRes; uniform float uT; uniform vec2 uLook; uniform float uZoom;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= .5; } return v; }
    // the sky, looked up by 3D direction so it has no seam for the lensing to bend into a ring
    float hash3(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
      return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z); }
    vec3 sky(vec3 d){
      vec3 c = vec3(0.);
      for (int L = 0; L < 3; L++) {
        float sc = 70. + float(L) * 120.;
        vec3 g = d * sc, id = floor(g);
        float h = hash3(id + float(L) * 13.1);
        if (h > .9) {
          vec3 o = vec3(hash3(id + 1.3), hash3(id + 5.9), hash3(id + 9.4));
          float r = length(g - id - o);
          c += vec3(smoothstep(.075, .0, r) * (.25 + (h - .9) * 18.));
        }
      }
      float haze = noise3(d * 3.) * .6 + noise3(d * 7.) * .3 + noise3(d * 15.) * .1;
      c += vec3(.012) * pow(haze, 4.) * 4.;
      return c;
    }
    void main(){
      vec2 uv = (gl_FragCoord.xy - .5 * uRes) / uRes.y * uZoom;
      float pitch = .28 + uLook.y, yaw = uLook.x;
      vec3 ro = vec3(sin(yaw) * cos(pitch), sin(pitch), -cos(yaw) * cos(pitch)) * 28.;
      vec3 fw = normalize(-ro), rt = normalize(cross(vec3(0., 1., 0.), fw)), up = cross(fw, rt);
      vec3 pos = ro, vel = normalize(fw * 2. + rt * uv.x + up * uv.y);
      float h2 = dot(cross(pos, vel), cross(pos, vel));
      vec3 col = vec3(0.); float a = 0., glow = 0., haze = 0.; bool fell = false;
      for (int i = 0; i < 900; i++) {
        float r2 = dot(pos, pos), r = sqrt(r2);
        if (r < 1.) { fell = true; break; }
        float dt = clamp(.016 * r * r / (r + 2.), .004, .5);   // fine steps near the hole: a clean shadow edge
        vec3 prev = pos;
        vel += -1.5 * h2 * pos / (r2 * r2 * r) * dt;
        pos += vel * dt;
        // light that skims the photon sphere (r = 1.5) piles up into the thin bright ring around the shadow
        glow += dt * exp(-pow((r - 1.52) * 7., 2.));
        // a little light scattered just above and below the disk, so it blooms instead of ending in a hard line
        float pr = length(pos.xz);
        if (pr > 2.6 && pr < 11.) haze += dt * exp(-pos.y * pos.y * 30.) * pow(3. / pr, 3.);
        if (prev.y * pos.y < 0.) {                                 // crossed the disk plane
          vec3 q = mix(prev, pos, prev.y / (prev.y - pos.y));
          float qr = length(q.xz);
          if (qr > 2.45 && qr < 12.) {
            float ang = atan(q.z, q.x) + uT * .9 * pow(qr, -1.5);  // inner gas orbits faster, so the streaks shear
            vec2 cs = vec2(cos(ang), sin(ang));
            // streaks that follow the orbit: fine in radius, long along the circle (sampled on the circle: no seam)
            // blended gas, not strands: broad bands and clumps that mix (a warped lookup keeps it swirling, not striped)
            vec3 w = vec3(qr * 2.2, cs * 1.8);
            vec3 warp = vec3(noise3(w), noise3(w + 7.1), noise3(w + 3.7)) - .5;
            float streak = noise3(vec3(qr * 3.6, cs * 2.4) + warp * 1.6) * .55 + noise3(vec3(qr * 8.5, cs * 4.5) + warp) * .3 + noise3(vec3(qr * 18., cs * 8.)) * .15;
            streak = mix(.55, streak, .75);
            float x = (qr - 2.45) / 9.55;
            float profile = smoothstep(0., .02, x) * pow(1. - x, 2.2) * smoothstep(1., .82, x);   // a sharp, hot inner edge fading outward
            vec3 orbit = normalize(vec3(-q.z, 0., q.x));
            float beta = sqrt(.5 / qr);
            float dop = 1. / (1. - beta * dot(orbit, -normalize(vel)));
            float lum = profile * (.3 + 1.2 * streak) * pow(dop, 2.4) * 1.25;
            float op = clamp(profile * (.6 + .9 * streak) * 1.6, 0., 1.);
            float under = prev.y < 0. ? .16 : 1.;   // the disk seen from below (the arc under the hole) stays quieter
            col += (1. - a) * op * vec3(lum * under);
            a += (1. - a) * op;
            if (a > .985) break;
          }
        }
        if (r2 > 2500.) break;
      }
      if (!fell) col += (1. - a) * sky(normalize(vel));
      if (!fell) col += vec3(glow * .16) * (1. - a * .7);        // the shadow stays black: light that falls in never comes out
      
      col = 1. - exp(-col * 1.2);
      col = pow(col, vec3(.92)) * vec3(1., .988, .965);           // the page's off-white
      gl_FragColor = vec4(col, 1.);
    }`;
const VS = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }";
window.render = (W, H, zoom) => {
  const cv = document.getElementById("c"); cv.width = W; cv.height = H;
  const gl = cv.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const l = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(pr, n);
  gl.viewport(0, 0, W, H); gl.uniform2f(U("uRes"), W, H); gl.uniform1f(U("uT"), 6.); gl.uniform2f(U("uLook"), 0, 0); gl.uniform1f(U("uZoom"), zoom);
  gl.enable(gl.SCISSOR_TEST);
  const strip = 64;                                   // small strips, so the GPU never stalls long enough to reset
  for (let y = 0; y < H; y += strip) { gl.scissor(0, y, W, strip); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish(); }
  return cv.toDataURL("image/png");
};
</script></body></html>
