  if ((monitorBox(ro, rd, t, nn) && t < far) || (box(ro, rd, NECK0, NECK1, t, nn) && t < far)) return true;
#ifndef NOKB
  if (box(ro, rd, KB0, KB1, t, nn) && t < far) return true;
#endif
#if !defined(CITY) && !defined(NIGHT)
  for (int i = 0; i < LEAVES; i++) if (leaf(ro, rd, i, t, q) && t < far) return true;
#endif
  return false;
}

// light from the panel itself, as a 6x4 grid of patches of what it's showing
vec3 screenLight(vec3 p, vec3 n) {
  vec3 s = vec3(0.0);
  for (int j = 0; j < 4; j++) for (int i = 0; i < 6; i++) {
    vec2 uv = (vec2(float(i), float(j)) + 0.5) / vec2(6.0, 4.0);
    vec3 d = uMc + uMr * ((uv.x - 0.5) * SW) + uMu * ((0.5 - uv.y) * SH) - p;
    float r2 = dot(d, d); d *= inversesqrt(r2);
    s += textureLod(uScr, uv, 7.5).rgb * max(dot(n, d), 0.0) * max(-dot(uMn, d), 0.0) / r2;
  }
  return s * uBright * SW * SH / (24.0 * PI);
}
vec3 lampLight(vec3 p, vec3 n, inout uint seed, out vec3 l) {   // l: which way the light came from
  l = uLamp + (vec3(rnd(seed), rnd(seed), rnd(seed)) - 0.5) * 20.0 - p;   // a lamp head, so the shadows are soft
  float r2 = dot(l, l), r = sqrt(r2); l /= r;
  float c = dot(n, l);
  if (c <= 0.0 || blocked(p + n * 0.03, l, r)) return vec3(0.0);
  return uLampCol * c / r2;
}
vec3 lampLight(vec3 p, vec3 n, inout uint seed) { vec3 l; return lampLight(p, n, seed, l); }
vec3 bounce(vec3 p, vec3 n) {   // the lamp's light back off the ceiling and walls: no shadows, from all round but mostly from its side
  vec3 l = uLamp - p; float r2 = dot(l, l);
  return uLampCol * 0.2 * (0.45 + 0.55 * max(dot(n, l * inversesqrt(r2)), 0.0)) / r2;
}
vec3 lit(vec3 p, vec3 n, vec3 albedo, inout uint seed) {
  vec3 e = screenLight(p, n) * LIFT + lampLight(p, n, seed) + bounce(p, n) + AMBIENT;
#ifdef CITY
  e += GLOW * (0.5 + 0.5 * max(-n.z, 0.0));
#endif
  return albedo * e;
}

vec3 reflScreen(vec3 p, vec3 r, float lod) {   // a blurry reflection of the panel in something below it
  float dn = dot(r, uMn); if (dn >= 0.0) return vec3(0.0);
  vec3 oc = p - uMc; float t = -dot(oc, uMn) / dn; if (t < 0.0) return vec3(0.0);
  vec3 q = oc + r * t; vec2 uv = vec2(dot(q, uMr) / SW + 0.5, 0.5 - dot(q, uMu) / SH);
  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return vec3(0.0);
  return textureLod(uScr, uv, lod).rgb * uBright;
}

// the panel: RGB stripes box-filtered over what one camera pixel sees, so they beat into moire like the real thing
float stripeI(float x, float a, float b) { return floor(x) * (b - a) + clamp(fract(x), a, b) - a; }
float stripe(float x, float w, float a, float b) { w = max(w, 1e-3); return (stripeI(x + 0.5 * w, a, b) - stripeI(x - 0.5 * w, a, b)) / w; }
vec3 subpixels(vec2 px, vec2 w) {
  float row = stripe(px.y, w.y, 0.05, 0.95) / 0.9;
  return vec3(stripe(px.x, w.x, 0.02, 0.31), stripe(px.x, w.x, 0.35, 0.64), stripe(px.x, w.x, 0.68, 0.97)) / 0.29 * row;
}
vec3 coating(vec3 lp, vec3 p, vec3 rd) {   // the matte anti-glare film: a faint haze of the room, smudged
  vec3 r = reflect(rd, uMn), l = normalize(uLamp - p);
  float smudge = 0.35 + 0.9 * smoothstep(0.5, 0.85, fbm(lp.xy * 0.16 + 7.3));
#ifdef NIGHT
  vec3 room = vec3(0.0005, 0.0006, 0.0009) * exp((dot(r, normalize(ROOM)) - 1.0) * 4.0);   // the room behind the phone, dark: a faint cool veil
#else
  vec3 room = vec3(0.0018, 0.0013, 0.0008) * exp((dot(r, normalize(ROOM)) - 1.0) * 4.0);   // the room behind the phone, a warm veil sliding as it moves
#endif
  return (uLampCol * 1.6e-6 * exp((dot(r, l) - 1.0) * 9.0) + room + vec3(0.0009, 0.001, 0.0012)) * smudge;
}
vec3 screenAt(vec3 lp, vec3 rd, vec2 fp) {
  vec2 uv = vec2(lp.x / SW + 0.5, 0.5 - lp.y / SH);
  vec3 c = textureLod(uScr, uv, max(log2(max(fp.x, fp.y)), 0.0)).rgb * mix(vec3(1.0), subpixels(uv * vec2(1920.0, 1080.0), fp * 0.6), 0.6);
  float cosv = clamp(-dot(rd, uMn), 0.0, 1.0);
  vec2 e = vec2(SW, SH) * 0.5 - abs(lp.xy);
  float glow = 0.012 * pow(1.0 - cosv, 1.3) + 0.0022 * exp(-e.y / 1.8) * (0.4 + fbm(lp.xy * 0.25)) + 0.0012 * exp(-e.x / 2.5);   // IPS glow and backlight bleed
  return (c + vec3(0.82, 0.88, 1.0) * glow) * uBright;

// the keyboard lit: caps of capC with legends of legC printed on their tops, the plate and the case; gloss is how much the caps

vec3 keyboard(vec3 p, vec3 n, vec3 d, float t, inout uint seed, vec3 capC, vec3 legC, vec3 plateC, vec3 caseC, float gloss) {
  int m; vec3 kc; vec2 k = p.xz - KB0.xz;
  float h = kbH(k, m, kc);
  if (abs(n.y) < 0.05 && h < KRIM) m = 0;   // the case's sides
  float fp = (2.0 * uAp * abs(1.0 - t / uFocus) + t / uF) * KBPX;   // how many texels one sample's blur covers
  vec4 tx = textureLod(uKb, k / (KB1.xz - KB0.xz), log2(max(fp, 1.0)));
  vec3 alb = caseC; float ao = 1.0, sh = 0.25;
  if (m == 2) {
    float onTop = smoothstep(0.86, 0.97, (h - KPLATE) / (kc.z - KPLATE));
    alb = mix(capC * (0.9 + 0.2 * tx.b) * (0.94 + 0.12 * fbm(p.xz * 3.1)), legC, tx.r * onTop);
    ao = mix(0.25, 1.0, smoothstep(KPLATE, kc.z, h));
    sh = mix(0.35, 1.0, onTop);
  } else if (m == 1) { alb = plateC; ao = 0.2; sh = 0.1; }
  vec3 l, le = lampLight(p, n, seed, l);
  vec3 e = (screenLight(p, n) * LIFT + bounce(p, n) + AMBIENT) * ao + le * mix(1.0, ao, 0.6);
#ifdef CITY
  e += GLOW * (0.5 + 0.5 * max(-n.z, 0.0)) * ao;
#endif
  float fres = 0.04 + 0.96 * pow(1.0 - clamp(-dot(d, n), 0.0, 1.0), 5.0), g = gloss * sh * (0.35 + 1.65 * tx.g);
  vec3 r = reflect(d, n);
  return alb * e + (reflScreen(p, r, mix(6.5, 4.0, tx.g)) * fres * g + le * fres * g * 6.0 * pow(max(dot(n, normalize(l - d)), 0.0), mix(18.0, 50.0, tx.g))) * ao;
}

#ifdef CITY
// ============================================================================ the city through the window
// rows of buildings at 120, 220, 420 and 900 m, the street 55 m down, then the sky; all in cm like the rest. The near rows are mostly
// lower than these 18 floors, so you look over their roofs to the towers
const vec3 HAZE = vec3(0.0095, 0.0062, 0.0046);   // the city's own light in the air, low down
vec3 sky(vec3 d) {
  vec3 c = mix(HAZE, vec3(0.0009, 0.0013, 0.0029), smoothstep(-0.02, 0.38, d.y));   // orange low down, navy above
  return c * (0.72 + 0.56 * fbm(d.xz / max(d.y + 0.12, 0.05) * 1.6 + 4.7));   // low cloud, lit from below
}
vec3 windows(vec2 q, float b) {   // a facade: q is cm across it and up from the street, b the building's own random number
  bool office = fract(b * 3.77) < 0.28;   // offices are lit a floor at a time, in long cool bands; flats a room at a time
  vec2 size = office ? vec2(mix(150.0, 210.0, fract(b * 7.31)), mix(340.0, 400.0, fract(b * 13.7)))

  vec2 s = q / size, cell = floor(s), f = s - cell;
  vec2 m = office ? vec2(0.04, 0.22) : vec2(mix(0.14, 0.3, fract(b * 17.9)), mix(0.16, 0.3, fract(b * 23.3)));   // the wall round each window
  if (f.x < m.x || f.x > 1.0 - m.x || f.y < m.y || f.y > 1.0 - 0.6 * m.y) return vec3(0.0022, 0.002, 0.0019) * (0.5 + fract(b * 5.93));
  vec2 w = (f - m) / vec2(1.0 - 2.0 * m.x, 1.0 - 1.6 * m.y);   // 0 to 1 across the window
  float h = hash2(cell + b * 97.3), h2 = hash2(cell * 1.37 + b * 31.1 + 5.0), lived = hash2(vec2(cell.y, b * 51.0));
  bool isOn = office ? lived > 0.45 && h < 0.9 : h < mix(0.12, 0.42, fract(b * 11.3)) * (0.6 + 0.8 * lived);
  if (!isOn) return vec3(0.0013, 0.0015, 0.0021);   // a dark window, the sky in its glass
  vec3 col = office ? vec3(0.78, 0.9, 1.0) : h2 < 0.6 ? vec3(1.0, 0.58, 0.28) : h2 < 0.88 ? vec3(1.0, 0.75, 0.48) : vec3(0.62, 0.74, 1.0);
  float lum = office ? 0.07 : 0.012 * exp(2.6 * fract(h2 * 23.0));   // most rooms dim, a few bright
  float glass = fract(h2 * 7.0);   // what's at the glass: nothing, a curtain drawn over one side, or blinds half down
  lum *= glass < 0.35 ? 1.0 : glass < 0.7 ? mix(1.0, 0.35, step(0.25 + 0.5 * fract(h2 * 3.0), w.x)) : mix(1.0, 0.3, step(0.55, w.y));
  if (!office && fract(b * 29.1) < 0.5) lum *= smoothstep(0.0, 0.06, abs(w.x - 0.5));   // a frame down the middle

}
vec3 outside(vec3 o, vec3 d) {

    float x = p.x / cell + 0.37 * float(k), i = floor(x), fx = x - i;
    float b = hash2(vec2(i, 19.0 * float(k) + 1.0)), b2 = hash2(vec2(i * 1.7, 7.0 * float(k) + 5.0));
    float w0 = 0.04 + 0.2 * fract(b * 3.3), w1 = 0.96 - 0.2 * fract(b * 5.1);
    float tall = k == 0 ? mix(1500.0, 6500.0, b2) : k == 1 ? mix(2500.0, 10000.0, b2 * b2) : k == 2 ? mix(3000.0, 16000.0, b2 * b2) : mix(4000.0, 30000.0, b2 * b2 * b2);
    float top = STREET + tall, haze = 1.0 - exp(-D / 150000.0);
    if (b < 0.2 || fx < w0 || fx > w1) continue;   // a gap between buildings
    float sb = tall > 12000.0 && fract(b * 41.0) < 0.5 && p.y > top - tall * 0.12 ? 0.22 * (w1 - w0) : 0.0;   // a tower's setback near the top
    if (p.y < top && fx > w0 + sb && fx < w1 - sb) {
      vec3 c = windows(vec2((fx - w0) * cell, p.y - STREET), b);
      if (tall > 14000.0 && fract(b * 53.0) < 0.4 && p.y > top - 900.0) c = vec3(0.034, 0.038, 0.042);   // a lit crown
      return mix(c, HAZE, haze);
    }
    if (d.y < 0.0 && p.y > top && p.y - top < 2500.0 * d.y / d.z) return mix(vec3(0.0016, 0.0015, 0.0015), HAZE, haze);   // its roof, from above
    vec2 e = vec2((fx - 0.5 * (w0 + w1)) * cell, p.y - top - 300.0);   // the red light on top of some of the tallest
    if (tall > 15000.0 && fract(b * 61.0) < 0.6 && dot(e, e) < 10000.0) return vec3(3.0, 0.12, 0.05);
  }

    return vec3(0.0012, 0.001, 0.0009) + vec3(1.0, 0.55, 0.22) * 0.05 * exp(-(a * a + c * c) / 4.0e5);

}
vec3 glassView(vec3 p, vec3 d, inout uint seed) {   // the city through the glass, and the dark room reflected in it
  float f = 0.08 + 0.92 * pow(1.0 - clamp(-d.z, 0.0, 1.0), 5.0);   // two panes reflect about twice what one does
  vec3 r = vec3(d.xy, -d.z), n, lp; float t;
  int id = trace(p + r * 0.05, r, t, n, lp);
  vec3 back;
  if (id == 0) {   // the rest of the room, behind the phone: dark but for the lamp
    float c = dot(r, normalize(uLamp - p));
    back = vec3(0.003, 0.0024, 0.0019) + uLampCol * (3.0e-3 * smoothstep(0.9965, 0.9985, c) + 3.0e-6 * exp((c - 1.0) * 5.0));
  } else back = lit(p + r * t, n, id == 5 ? vec3(0.34, 0.235, 0.145) : id == 7 || id == 11 ? vec3(0.45) : vec3(0.03), seed);
#ifdef DIMCITY
  f *= 0.4;   // DIMCITY: a dimmer, later-at-night city, with the room in the glass dimmed to match
  return outside(p, d) * (1.0 - f) * 0.92 * 0.3 + back * f;
#else
  return outside(p, d) * (1.0 - f) * 0.92 + back * f;
#endif
}
#endif

vec3 radiance(vec3 o, vec3 d, vec2 fp, inout uint seed) {
  float t; vec3 n, lp;
  int id = trace(o, d, t, n, lp);
  vec3 p = o + d * t;
  if (id == 1) {
    vec2 a = abs(lp.xy) - vec2(SW, SH) * 0.5;
    if (a.x < 0.0 && a.y < 0.0) return screenAt(lp, d, fp) + coating(lp, p, d);
    if (max(a.x, a.y) < BORDER) return vec3(0.0003) + coating(lp, p, d);
    vec3 c = lit(p, n, vec3(0.028, 0.028, 0.03), seed);
    vec2 led = vec2(SW * 0.5 - 2.6, -SH * 0.5 - 1.05);   // the power light on the chin
    return c + vec3(0.9, 0.95, 1.0) * 0.3 * smoothstep(0.13, 0.07, length(lp.xy - led));
  }
  if (id == 2) return lit(p, n, vec3(0.03), seed);
  if (id == 3) return lit(p, n, vec3(0.05, 0.05, 0.055), seed);
  if (id == 4) {   // the stand's foot: dark metal, with the panel glinting in it
    vec3 c = lit(p, n, vec3(0.05), seed);
    if (n.y > 0.5) c += reflScreen(p, reflect(d, n), 4.5) * 0.05;
    return c;
  }
#ifdef CITY
  if (id == 5) {   // light oak, its grain along the desk, in a satin finish that catches the panel
    vec3 oak = vec3(0.34, 0.235, 0.145) * (0.78 + 0.44 * fbm(p.xz * vec2(0.045, 0.9)));
    return lit(p, n, oak, seed) * kbContact(p) + reflScreen(p, reflect(d, n), 5.0) * 0.025;
  }
  if (id == 6) return lit(p, n, vec3(0.42, 0.42, 0.43) * (0.95 + 0.1 * fbm(p.xy * 0.05)), seed);
  if (id == 7) {   // a white keyboard with grey legends (DARKKB: graphite caps, pale legends, catching the screen)
#ifdef DARKKB
    return keyboard(p, n, d, t, seed, vec3(0.03, 0.03, 0.033), vec3(0.32, 0.32, 0.31), vec3(0.008), vec3(0.022), 0.6);
#else
    return keyboard(p, n, d, t, seed, vec3(0.56, 0.555, 0.54), vec3(0.07), vec3(0.3), vec3(0.5), 0.15);
#endif
  }
  if (id == 9) return glassView(p, d, seed);
  if (id == 10) return lit(p, n, vec3(0.02), seed);              // the frame, black aluminium
  if (id == 11) return lit(p, n, vec3(0.6, 0.59, 0.56), seed);   // the board under the window, painted white
#else
  if (id == 5) {   // a felt desk mat on dark wood
    vec2 q = p.xz;
    float mat = step(abs(q.x), 42.0) * step(-6.0, q.y) * step(q.y, 40.0);
    vec3 wood = vec3(0.075, 0.045, 0.028) * (0.7 + 0.6 * fbm(q * vec2(0.08, 1.4)));
    vec3 felt = vec3(0.032, 0.033, 0.036) * (0.85 + 0.3 * fbm(q * 3.0));
    return lit(p, n, mix(wood, felt, mat), seed) * kbContact(p);
  }
#ifdef NIGHT
  if (id == 6) return lit(p, n, vec3(0.10, 0.16, 0.14) * (0.92 + 0.16 * fbm(p.xy * 0.05)), seed);   // painted deep green
#else
  if (id == 6) return lit(p, n, vec3(0.30, 0.29, 0.27) * (0.92 + 0.16 * fbm(p.xy * 0.05)), seed);
#endif
  if (id == 7) return keyboard(p, n, d, t, seed, vec3(0.04, 0.04, 0.043), vec3(0.24), vec3(0.01), vec3(0.025), 0.5);
#endif
  if (id == 8) {   // a leaf: deep green, paler zigzag bands across it, a yellow rim and a waxy shine; the lamp glows through it a little from behind
    int i = int(lp.z + 0.5); float x = lp.x / max(leafWidth(lp.y), 1e-3);   // -1 to 1, edge to edge
    float band = smoothstep(0.42, 0.68, fbm(vec2(lp.y * uLeafS[i].x * 0.6 + abs(x) * 1.8, float(i) * 13.7)));
    vec3 alb = mix(vec3(0.02, 0.045, 0.018), vec3(0.055, 0.08, 0.045), band);
    alb = mix(alb, vec3(0.15, 0.13, 0.03), smoothstep(0.75, 0.9, abs(x)));
    vec3 l, e = lampLight(p, n, seed, l);   // the panel faces away from it, so only the lamp and the room light it
    return alb * (e + bounce(p, n) + AMBIENT) + e * 0.05 * pow(max(dot(n, normalize(l - d)), 0.0), 24.0) + lampLight(p, -n, seed) * vec3(0.01, 0.025, 0.004);
  }
  return vec3(0.0);
}

vec2 screenPx(vec3 o, vec3 d) {   // where a ray meets the panel's plane, in panel pixels
  vec3 oc = o - uMc; float t = -dot(oc, uMn) / dot(d, uMn); vec3 p = oc + d * t;
  return vec2((dot(p, uMr) / SW + 0.5) * 1920.0, (0.5 - dot(p, uMu) / SH) * 1080.0);
}

  vec2 dy = screenPx(uP[0], normalize(uRr[0] * c0.x + uRu[0] * (c0.y + 1.0) + uRf[0] * uF)) - a;
  vec2 fp = vec2(length(vec2(dx.x, dy.x)), length(vec2(dx.y, dy.y)));

window.renderFrame = async (t) => {
  const clip = clipAt(t), ct = t - clip.t0;

};

// one slide of the carousel, as a JPEG in base64. By the window the city's lights are well out of focus, and 12 passes smooth their blur
window.renderPhoto = async (i, passes = PHOTO_ROOM === "city" ? 12 : 1) => {
  const ph = PHOTOS[i];
  if (ph.img) {   // a still on the screen, no pointer
    const im = new Image(); im.src = `${SET}-screen/${ph.img}.png`; await im.decode();
    sg.drawImage(im, 0, 0, 1920, 1080);
  } else await showScreen(ph.src, ph.file);

};
window.ready = (async () => {
  const file = `footage/${FOOTAGE.file}`;
  await new Promise((r, j) => { video.muted = true; video.preload = "auto"; video.oncanplaythrough = r; video.onerror = () => j(new Error(file + ".mp4")); video.src = file + ".mp4"; video.load(); });
  LOG = (await (await fetch(file + ".json")).json()).log;
  if (FOOTAGE.patch) await document.fonts.load("400 13.6px 'Geist Mono'");
  else { await seek(video, FOOTAGE.blankAt); blank.width = 1920; blank.height = 1080; blank.getContext("2d").drawImage(video, 0, 0, 1920, 1080); }
  const q = Q.get("t");

// The keyboard: clicky switches, tuned against a close-miked recording of a QK65 with Outemu clickies. A press is the switch's click jacket

window.renderAudio = async () => {
  await window.ready;
