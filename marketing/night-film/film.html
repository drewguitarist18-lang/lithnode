<!doctype html>
<html><head><meta charset="utf-8"><title>Lithnode Night Film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;background:#08080a}canvas{display:block;width:100vw;height:auto}</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script>
// A 30-second film of the real app and site: footage/*.mp4 recorded by capture.js, composited over the night sky.
// render.js serves the repo, calls renderFrame(t) for each of 900 frames, then renderAudio() for the score.
// Open film.html?t=12.5 for a still of any moment.
const W = 1920, H = 1080, LENGTH = 30;
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const C = { void: "#08080a", ink: "#ecebe6", soft: "#b1b0aa", faint: "#74736e" };
const F = { pix: "'Pixelify Sans', monospace", mono: "'Geist Mono', ui-monospace, monospace" };
const LOGO = [".##..........##.", "#.#..........#.#", "###..........###", ".#............#.", ".#............#.", ".##.########.##.", "..############..", "..##.######.##..", "..############..", "...##########...", "...#.#....#.#...", "...#.#....#.#...", "..##.##..##.##.."];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, k) => a + (b - a) * k;
const eio = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(s, x, y, font, color, align = "center", alpha = 1) { g.save(); g.globalAlpha *= alpha; g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic"; g.fillText(s, x, y); g.restore(); }

// ============================================================================ footage
// each scene plays one clip: `map` is [film time, clip time] knots (sped up between them), `cam` is [film time, centre x, centre y, zoom]
const SCENES = [
  { id: "describe", clip: "describe", t0: 2.8, t1: 8, map: [[3, 2.3], [5.6, 9.2], [6.2, 11.0], [7.0, 15.0], [8, 16.8]],
    cam: [[2.8, 960, 290, 1.9], [5.9, 960, 290, 1.9], [6.7, 960, 540, 1.0], [8, 960, 580, 1.08]],
    cap: ["Describe the job.", "One line in. A team of agents out."] },
  { id: "run", clip: "run", t0: 8, t1: 14, map: [[8, 2.6], [9.6, 10.9], [14, 28.4]],
    cam: [[8, 960, 560, 1.18], [9.5, 960, 560, 1.18], [10.4, 760, 600, 1.3], [14, 820, 650, 1.26]],
    cap: ["Hit run. They split the work.", "A scout hunts the web. Two checkers judge every find."] },
  { id: "office", clip: "office", t0: 14, t1: 18, map: [[14, 19.0], [18, 27.0]],
    cam: [[14, 930, 300, 1.7], [18, 940, 290, 1.86]],
    cap: ["Watch every agent work.", "The Office shows each session, live."] },
  { id: "approve", clip: "run", t0: 18, t1: 22, map: [[18, 29.3], [20.6, 32.9], [21.15, 35.6], [21.25, 36.4], [22, 37.9]],
    cam: [[18, 1420, 430, 1.9], [20.55, 1480, 400, 2.25], [20.95, 960, 560, 1.0], [21.24, 960, 560, 1.0], [21.25, 960, 600, 1.0], [22, 860, 640, 1.12]],
    cap: ["Nothing ships without your go.", "The checkers cut the weak ones. You approve the rest."] },
  { id: "site", clip: "site", t0: 22, t1: 26.3, map: [[22, 1.2], [26.3, 7.2]],
    cam: [[22, 960, 540, 1.0]], browser: true,
    cap: ["Free. Open source. Yours.", "MIT licensed · runs on the Claude, Codex or Cursor plan you have"] },
];
const CLIPS = ["describe", "run", "office", "site"];
const vids = {}, logs = {};
function mapTime(m, t) {
  if (t <= m[0][0]) return m[0][1];
  for (let i = 1; i < m.length; i++) if (t <= m[i][0]) return lerp(m[i - 1][1], m[i][1], (t - m[i - 1][0]) / (m[i][0] - m[i - 1][0]));
  return m[m.length - 1][1];
}
function rateAt(m, t) { for (let i = 1; i < m.length; i++) if (t <= m[i][0]) return (m[i][1] - m[i - 1][1]) / (m[i][0] - m[i - 1][0]); return 1; }
function camAt(c, t) {
  if (t <= c[0][0]) return c[0].slice(1);
  for (let i = 1; i < c.length; i++) if (t <= c[i][0]) { const k = eio((t - c[i - 1][0]) / (c[i][0] - c[i - 1][0])); return [1, 2, 3].map((j) => lerp(c[i - 1][j], c[i][j], k)); }
  return c[c.length - 1].slice(1);
}
// the part of the 1920x1080 recording the camera sees
function crop(cam) {
  const [cx, cy, z] = cam, sw = W / z, sh = H / z;
  return { sx: clamp(cx - sw / 2, 0, W - sw), sy: clamp(cy - sh / 2, 0, H - sh), sw, sh };
}
// pointer and clicks from the capture log, as film-time events (for the cursor's ripples and the sound)
const EVENTS = [];
function buildEvents() {
  for (const s of SCENES) {
    const L = logs[s.clip] || [];
    for (const e of L) {
      if (e.kind !== "down" && e.kind !== "key") continue;
      for (let i = 1; i < s.map.length; i++) {
        const [fa, ca] = s.map[i - 1], [fb, cb] = s.map[i];
        if (e.t >= ca && e.t < cb) { const ft = fa + (e.t - ca) / (cb - ca) * (fb - fa); if (ft >= s.t0 && ft < s.t1) EVENTS.push({ ft, kind: e.kind, clip: s.clip, x: e.x, y: e.y }); }
      }
    }
  }
  EVENTS.sort((a, b) => a.ft - b.ft);
}
function pointerAt(clip, t) {
  const L = (logs[clip] || []).filter((e) => e.kind === "move" || e.kind === "down");
  if (!L.length || t < L[0].t - .4) return null;
  let i = 0; while (i + 1 < L.length && L[i + 1].t <= t) i++;
  const a = L[i], b = L[i + 1];
  if (b && t > a.t && b.t - a.t < .1) { const k = (t - a.t) / (b.t - a.t); return [lerp(a.x, b.x, k), lerp(a.y, b.y, k)]; }
  return [a.x, a.y];
}

// ============================================================================ the night sky
const rnd = mulberry(18);
const STARS = Array.from({ length: 520 }, () => ({ x: rnd() * W, y: rnd() * H, r: rnd() < .08 ? 1.6 + rnd() : .5 + rnd() * .8, a: .25 + rnd() * .7, f: .5 + rnd() * 2.5, p: rnd() * 7, d: .2 + rnd() }));
const grain = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), im = x.createImageData(256, 256), r = mulberry(4);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0); return c;
})();
function sky(t) {
  g.fillStyle = C.void; g.fillRect(0, 0, W, H);
  const neb = (x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace("A", a)); gr.addColorStop(1, col.replace("A", 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  neb(380 + Math.sin(t * .11) * 60, 180, 900, "rgba(60,80,150,A)", .16);
  neb(1600 + Math.cos(t * .09) * 50, 900, 1000, "rgba(110,70,160,A)", .14);
  neb(1100, 120, 600, "rgba(150,110,90,A)", .05);
  for (const s of STARS) {
    const x = (s.x - t * 6 * s.d + W) % W, tw = .55 + .45 * Math.sin(t * s.f + s.p);
    g.globalAlpha = s.a * tw; g.fillStyle = s.r > 1.5 ? "#dfe6ff" : C.ink;
    g.fillRect(x, s.y, s.r, s.r);
  }
  g.globalAlpha = 1;
}
const bh = document.createElement("video");
function hush(y, r, a) {   // a soft dark pool so type reads over the bright disk
  const gr = g.createRadialGradient(W / 2, y, 0, W / 2, y, r);
  gr.addColorStop(0, `rgba(8,8,10,${a})`); gr.addColorStop(.55, `rgba(8,8,10,${a * .7})`); gr.addColorStop(1, "rgba(8,8,10,0)");
  g.save(); g.translate(W / 2, y); g.scale(1.5, 1); g.translate(-W / 2, -y); g.fillStyle = gr; g.fillRect(-W, 0, W * 3, H); g.restore();
}
function blackHole(t, src, alpha, scale = 1) {   // the site's ray-traced black hole (footage/hole.mp4, 1920x1200), cropped to the frame
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha; g.translate(W / 2, H / 2); g.scale(scale, scale);
  g.drawImage(bh, 0, 60, 1920, 1080, -W / 2, -H / 2, W, H); g.restore();
}

// ============================================================================ pieces
function crab(cx, top, cell, t, from, spread, seed = 7) {   // Lithnode's logo; each pixel pops in on its own beat
  const r = mulberry(seed), w = LOGO[0].length * cell, x0 = cx - w / 2;
  g.save(); g.shadowColor = "rgba(236,235,230,.55)"; g.shadowBlur = cell * 1.6;
  LOGO.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch !== "#") return;
    const at = from + r() * spread, k = span(t, at, at + .22);
    if (k <= 0) return;
    const s = back(k), x = x0 + i * cell + cell / 2, y = top + j * cell + cell / 2;
    g.globalAlpha = Math.min(1, k * 2); g.fillStyle = k < 1 ? "#ffffff" : C.ink;
    g.fillRect(x - cell * s / 2, y - cell * s / 2, cell * s, cell * s);
  }));
  g.restore();
}
function crabPops(from, spread, seed = 7) { const r = mulberry(seed), out = []; LOGO.forEach((row) => [...row].forEach((ch) => { if (ch === "#") out.push(from + r() * spread); })); return out; }
function caption(t, s, big, small) {   // words rise in, one after another, then fade before the cut
  const tin = s.t0 + .2, out = 1 - span(t, s.t1 - .35, s.t1 - .05);
  if (t < tin || out <= 0) return;
  g.save(); g.font = `600 58px ${F.pix}`;
  const words = big.split(" "), widths = words.map((w) => g.measureText(w + " ").width), total = widths.reduce((a, b) => a + b, 0) - g.measureText(" ").width;
  let x = W / 2 - total / 2;
  words.forEach((w, i) => {
    const k = eout(span(t, tin + i * .06, tin + i * .06 + .4));
    text(w, x, 112 + (1 - k) * 22, `600 58px ${F.pix}`, C.ink, "left", k * out); x += widths[i];
  });
  const k2 = eout(span(t, tin + .35, tin + .8));
  text(small, W / 2, 158 + (1 - k2) * 10, `400 22px ${F.mono}`, C.soft, "center", k2 * out);
  g.restore();
}
function cursor(x, y, s, press) {
  g.save(); g.translate(x, y); g.scale(s * (press ? .86 : 1), s * (press ? .86 : 1));
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.5, 17); g.lineTo(9.5, 26); g.lineTo(13, 24.5); g.lineTo(9, 16); g.lineTo(16, 16); g.closePath();
  g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = 6; g.shadowOffsetY = 2;
  g.fillStyle = "#fff"; g.fill(); g.shadowColor = "transparent"; g.lineWidth = 1.4; g.strokeStyle = "#111"; g.stroke(); g.restore();
}
const WIN = { x: 210, y: 196, w: 1500, h: 844 };
// one window of footage: the clip, cropped by the camera, with its cursor and click ripples on top
function footageWindow(s, t, { scale = 1, alpha = 1, dy = 0 } = {}) {
  const v = vids[s.clip], cam = camAt(s.cam, t), c = crop(cam), ct = mapTime(s.map, t);
  let { x, y, w, h } = WIN; const bar = s.browser ? 46 : 0;
  if (s.browser) { w = 1400; h = 788 + bar; x = (W - w) / 2; y = 1040 - h; }
  y += dy + Math.sin(t * .7) * 3;
  g.save(); g.globalAlpha = alpha;
  g.translate(x + w / 2, y + h / 2); g.scale(scale, scale); g.translate(-(x + w / 2), -(y + h / 2));
  // shadow and a faint starlight rim
  g.save(); rr(x, y, w, h, 16); g.shadowColor = "rgba(0,0,0,.75)"; g.shadowBlur = 90; g.shadowOffsetY = 34; g.fillStyle = "#0b0b0e"; g.fill();
  g.shadowColor = "rgba(170,185,255,.16)"; g.shadowBlur = 50; g.shadowOffsetY = 0; g.fill(); g.restore();
  g.save(); rr(x, y, w, h, 16); g.clip();
  if (s.browser) {
    g.fillStyle = "#151518"; g.fillRect(x, y, w, bar);
    ["#ff5f57", "#febc2e", "#28c840"].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(x + 26 + i * 22, y + bar / 2, 6.5, 0, 7); g.fill(); });
    rr(x + w / 2 - 230, y + 10, 460, bar - 20, 13); g.fillStyle = "#0b0b0e"; g.fill();
    text("lithnode.com", x + w / 2, y + bar / 2 + 6, `500 17px ${F.mono}`, C.soft);
    g.fillStyle = "#26262b"; g.fillRect(x, y + bar - 1, w, 1);
  }
  g.drawImage(v, c.sx, c.sy, c.sw, c.sh, x, y + bar, w, h - bar);
  // the pointer, mapped through the camera
  const toWin = (px, py) => [x + (px - c.sx) / c.sw * w, y + bar + (py - c.sy) / c.sh * (h - bar)];
  for (const e of EVENTS) {
    if (e.clip !== s.clip || e.kind !== "down" || t < e.ft || t > e.ft + .55) continue;
    const k = (t - e.ft) / .55, [rx, ry] = toWin(e.x, e.y);
    g.beginPath(); g.arc(rx, ry, 8 + eout(k) * 46, 0, 7); g.strokeStyle = `rgba(236,235,230,${.75 * (1 - k)})`; g.lineWidth = 3 * (1 - k) + 1; g.stroke();
  }
  const p = pointerAt(s.clip, ct);
  if (p) {
    const pressed = EVENTS.some((e) => e.clip === s.clip && e.kind === "down" && t >= e.ft && t < e.ft + .1);
    const [px, py] = toWin(...p); cursor(px, py, clamp(.9 + cam[2] * .35, 1.2, 1.7), pressed);
  }
  g.restore();
  rr(x + .5, y + .5, w - 1, h - 1, 16); g.strokeStyle = "rgba(236,235,230,.16)"; g.lineWidth = 1; g.stroke();
  // honest about time-lapse
  const rate = rateAt(s.map, t);
  if (rate > 1.4 && t > s.t0 + .1) {
    const label = `${rate < 10 ? rate.toFixed(rate < 3 ? 1 : 0) : Math.round(rate)}× speed`;
    g.font = `500 15px ${F.mono}`; const tw = g.measureText(label).width + 26;
    rr(x + w - tw - 18, y + h - 48, tw, 30, 15); g.fillStyle = "rgba(8,8,10,.78)"; g.fill(); g.strokeStyle = "rgba(236,235,230,.18)"; g.stroke();
    text(label, x + w - 18 - tw / 2, y + h - 28, `500 15px ${F.mono}`, C.soft);
  }
  g.restore();
}

// ============================================================================ scenes
function open(t) {   // 0–3: the black hole, the crab assembling, the name
  if (t > 3.2) return;
  const out = span(t, 2.6, 3.1), sc = 1 + eio(out) * .18;
  blackHole(t, t, .62 * span(t, 0, 1.1) * (1 - out), 1.06 - t * .015);
  hush(560, 520, .55 * (1 - out));
  g.save(); g.globalAlpha = 1 - eio(out); g.translate(W / 2, 470); g.scale(sc, sc); g.translate(-W / 2, -470);
  crab(W / 2, 236, 14, t, .2, .95);
  const word = "Lithnode", font = `700 140px ${F.pix}`; g.font = font;
  const full = g.measureText(word).width; let x = W / 2 - full / 2;
  [...word].forEach((ch, i) => {
    const at = 1.05 + i * .06, k = span(t, at, at + .12);
    if (k > 0) text(ch, x, 590, font, k < 1 ? "#ffffff" : C.ink, "left", k);
    x += g.measureText(ch).width;
  });
  const k = eout(span(t, 1.75, 2.2));
  text("Your AI team. Managed.", W / 2, 668 + (1 - k) * 14, `500 42px ${F.pix}`, C.soft, "center", k);
  g.restore();
}
function scenes(t) {
  for (const s of SCENES) {
    if (t < s.t0 || t >= s.t1) continue;
    let o = {};
    if (s.id === "describe") { const k = eout(span(t, 2.8, 3.35)); o = { dy: (1 - k) * 260, scale: .88 + .12 * k, alpha: k }; }
    else if (s.id === "site") { const k = eio(span(t, 25.75, 26.3)); o = { scale: 1 - .1 * k, alpha: 1 - k }; }
    else { const k = eout(span(t, s.t0, s.t0 + .3)); o = { scale: 1.025 - .025 * k }; }
    footageWindow(s, t, o);
    if (s.id !== "site" || t < 25.9) caption(t, s, ...s.cap);
  }
}
function endCard(t) {   // 26–30
  if (t < 25.8) return;
  const a = span(t, 25.8, 26.6);
  blackHole(t, t, .8 * a, 1.12 - (t - 26) * .02);
  hush(560, 640, .78 * a);
  const fade = 1 - span(t, 29.4, 30);
  g.save(); g.globalAlpha = fade;
  crab(W / 2, 214, 11, t, 26.05, .5, 11);
  const k1 = eout(span(t, 26.35, 26.8));
  text("Lithnode", W / 2, 498 + (1 - k1) * 20, `700 150px ${F.pix}`, C.ink, "center", k1);
  const k2 = eout(span(t, 26.65, 27.1));
  text("Your AI team. Managed.", W / 2, 580 + (1 - k2) * 14, `500 46px ${F.pix}`, C.soft, "center", k2);
  const k3 = eout(span(t, 27.0, 27.45));
  text("Research  ·  ads  ·  content  ·  checks  ·  free and open source", W / 2, 650 + (1 - k3) * 10, `400 24px ${F.mono}`, "#9b9a94", "center", k3);
  const k4 = back(span(t, 27.35, 27.75));
  if (k4 > 0) {
    g.save(); g.translate(W / 2, 752); g.scale(k4, k4);
    rr(-170, -36, 340, 72, 36); g.fillStyle = C.ink; g.shadowColor = "rgba(236,235,230,.35)"; g.shadowBlur = 40; g.fill(); g.restore();
    text("lithnode.com", W / 2, 762, `600 30px ${F.mono}`, C.void, "center", Math.min(1, k4));
  }
  g.restore();
}
function flash(t, at, len = .16, a = .28) { const k = span(t, at, at + len); if (k <= 0 || k >= 1) return; g.fillStyle = `rgba(236,235,230,${a * (1 - k)})`; g.fillRect(0, 0, W, H); }
function post(t) {
  const v = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = "overlay"; g.globalAlpha = .06;
  const r = mulberry(Math.floor(t * 30) + 1); g.translate(-r() * 256, -r() * 256);
  g.fillStyle = g.createPattern(grain, "repeat"); g.fillRect(0, 0, W + 256, H + 256); g.restore();
}
const APPROVE_AT = 18 + (32.86 - 29.3) / (32.9 - 29.3) * 2.6;   // the approve click in run.json, through the approve map
function draw(t) {
  sky(t);
  open(t);
  scenes(t);
  endCard(t);
  [8, 14, 18, 22].forEach((c) => flash(t, c));
  flash(t, APPROVE_AT, .3, .35);
  post(t);
}

// ============================================================================ loading and seeking
function seek(v, s) {
  s = clamp(s, 0, v.duration - .04); const target = (Math.floor(s * 30) + .5) / 30;
  if (Math.abs(v.currentTime - target) < 1e-3 && v.readyState >= 2) return Promise.resolve();
  return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.currentTime = target; });
}
async function prepare(t) {
  const jobs = [];
  for (const s of SCENES) if (t >= s.t0 - .05 && t < s.t1) jobs.push(seek(vids[s.clip], mapTime(s.map, t)));
  if (t < 3.2) jobs.push(seek(bh, t + 2));
  if (t >= 25.8) jobs.push(seek(bh, t - 25.8 + 6));
  await Promise.all(jobs);
}
window.renderFrame = async (t) => { await prepare(t); draw(t); };
window.ready = (async () => {
  const load = (v, src) => new Promise((r, j) => { v.muted = true; v.preload = "auto"; v.oncanplaythrough = r; v.onerror = () => j(new Error(src)); v.src = src; v.load(); });
  const jobs = [load(bh, "footage/hole.mp4")];
  for (const c of CLIPS) { vids[c] = document.createElement("video"); jobs.push(load(vids[c], `footage/${c}.mp4`)); jobs.push(fetch(`footage/${c}.json`).then((r) => r.json()).then((j) => { logs[c] = j.log; })); }
  jobs.push(...[`700 140px ${F.pix}`, `600 58px ${F.pix}`, `500 42px ${F.pix}`, `400 22px ${F.mono}`, `500 15px ${F.mono}`, `600 30px ${F.mono}`].map((f) => document.fonts.load(f)));
  await Promise.all(jobs); buildEvents();
  const q = new URLSearchParams(location.search).get("t");
  if (q !== null) await window.renderFrame(+q);
  return true;
})();

// ============================================================================ the music: night synthwave, 120 BPM, A minor (Am F C G)
// a real arrangement: supersaw pads ducked by the kick, octave bass, drums, a lead melody, bells; reverb and a ping-pong delay
let ac, out, bus, duck, revIn, dlyIn, noiseBuf;
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const BEAT = .5, BAR = 2;
function noise() {
  if (noiseBuf) return noiseBuf;

const SAW = [-14, -7, 0, 7, 14];

const PADS = [[57, 60, 64, 69], [53, 57, 60, 65], [55, 60, 64, 67], [55, 59, 62, 67]];
const ROOTS = [33, 29, 36, 31];
const MELODY = [   // [beat in bar, midi, beats] for Am F C G
  [[0, 76, 1], [1, 79, .5], [1.5, 81, 1.5], [3, 79, .5], [3.5, 76, .5]],
  [[0, 77, 1], [1, 76, .5], [1.5, 72, 1.5], [3, 74, 1]],
  [[0, 76, 1], [1, 79, .5], [1.5, 84, 1.5], [3, 83, .5], [3.5, 79, .5]],
  [[0, 79, 1], [1, 81, .5], [1.5, 79, .5], [2, 74, 2]],

const chordIdx = (t) => Math.floor(t / BAR + 1e-6) % 4;
function score() {
